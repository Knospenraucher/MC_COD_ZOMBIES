name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Probe (temporär)
        run: bash .github/probe.sh
        continue-on-error: true
      - name: Build
        run: ./gradlew build
      - name: Mod-Jar hochladen
        uses: actions/upload-artifact@v4
        with:
          name: mczombies-jar
          path: build/libs/*.jar
